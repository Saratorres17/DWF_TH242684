# H2 en memoria
spring.datasource.url=jdbc:h2:mem:guia_jpa;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Pool Hikari (para ver valores explícitos en el IDE)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=guia_jpa_pool

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# (Opcional pero útil) Log de SQL + parámetros (Hibernate 6)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.orm.jdbc.extract=TRACE

# (Opcional) Inicializar con schema.sql / data.sql si existen
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Permitir acceso remoto a la consola (solo si lo necesitas)
# spring.h2.console.settings.web-allow-others=true

# Nombre del datasource
spring.datasource.generate-unique-name=false
spring.datasource.name=guia_jpa

# (Opcional) Zona horaria coherente si usas TIMESTAMP
# spring.jpa.properties.hibernate.jdbc.time_zone=America/El_Salvador
